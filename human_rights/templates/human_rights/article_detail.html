{% extends "base.html" %}

{% block title %}
{{ article.title }} | ASOK Foundation
{% endblock %}

{% block content %}

<section class="bg-slate-50 py-16 sm:py-20">

    <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">

        <!-- Category -->

        <div class="text-sm font-bold uppercase tracking-widest text-emerald-600">
            {{ article.category.name }}
        </div>


        <!-- Title -->

        <h1 class="mt-4 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl lg:text-5xl">
            {{ article.title }}
        </h1>


        <!-- Short Description -->

        <p class="mt-6 text-lg leading-8 text-slate-600">
            {{ article.short_description }}
        </p>


        <!-- Image -->

        {% if article.image %}

            <div class="mt-10 overflow-hidden rounded-3xl">

                <img
                    src="{{ article.image.url }}"
                    alt="{{ article.title }}"
                    class="w-full object-cover"
                >

            </div>

        {% endif %}


        <!-- Content -->

        <article class="mt-10 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-10">

            <div class="whitespace-pre-line text-base leading-8 text-slate-700">
                {{ article.content }}
            </div>

        </article>


        <!-- Back -->

        <div class="mt-8">

            <a
                href="{% url 'human_rights:home' %}"
                class="inline-flex items-center font-bold text-emerald-600 hover:text-emerald-700"
            >
                ← Back to Human Rights
            </a>

        </div>

    </div>

</section>

{% endblock %}
