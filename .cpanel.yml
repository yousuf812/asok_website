---
deployment:
  tasks:

    # Live Django application directory
    - export DEPLOYPATH=/home/safinter/asok-website/asok_website/

    # Copy project files
    - /bin/cp -R manage.py $DEPLOYPATH
    - /bin/cp -R config $DEPLOYPATH
    - /bin/cp -R activities $DEPLOYPATH
    - /bin/cp -R blog $DEPLOYPATH
    - /bin/cp -R complaints $DEPLOYPATH
    - /bin/cp -R contacts $DEPLOYPATH
    - /bin/cp -R core $DEPLOYPATH
    - /bin/cp -R donations $DEPLOYPATH
    - /bin/cp -R gallery $DEPLOYPATH
    - /bin/cp -R human_rights $DEPLOYPATH
    - /bin/cp -R legal_aid $DEPLOYPATH
    - /bin/cp -R membership $DEPLOYPATH
    - /bin/cp -R newsletter $DEPLOYPATH
    - /bin/cp -R projects $DEPLOYPATH
    - /bin/cp -R services $DEPLOYPATH
    - /bin/cp -R team $DEPLOYPATH
    - /bin/cp -R templates $DEPLOYPATH
    - /bin/cp -R static $DEPLOYPATH
    - /bin/cp -R requirements.txt $DEPLOYPATH

    # Install Python dependencies
    - /home/safinter/virtualenv/asok-website/3.13/bin/pip install -r $DEPLOYPATH/requirements.txt

    # Apply database migrations
    - /home/safinter/virtualenv/asok-website/3.13/bin/python $DEPLOYPATH/manage.py migrate --noinput

    # Collect static files
    - /home/safinter/virtualenv/asok-website/3.13/bin/python $DEPLOYPATH/manage.py collectstatic --noinput

    # Restart Passenger
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /usr/bin/touch $DEPLOYPATH/tmp/restart.txt