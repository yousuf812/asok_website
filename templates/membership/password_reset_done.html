{% extends "base.html" %}

{% block title %}Reset Link Sent | ASOK Foundation{% endblock %}

{% block content %}

<section class="min-h-[70vh] bg-slate-50 px-4 py-16">
    <div class="mx-auto max-w-md">

        <div class="rounded-3xl bg-white p-8 text-center shadow-xl ring-1 ring-slate-200">

            <div class="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-full bg-emerald-100 text-4xl">
                ✓
            </div>

            <h1 class="text-2xl font-black text-slate-900">
                Check Your Email
            </h1>

            <p class="mt-3 text-sm leading-6 text-slate-600">
                If your Member account has a registered email address,
                a password reset link has been sent there.
            </p>

            <a
                href="{% url 'membership:login' %}"
                class="mt-7 inline-flex w-full items-center justify-center rounded-xl bg-emerald-700 px-5 py-3.5 text-sm font-black text-white transition hover:bg-emerald-800"
            >
                Back to Member Login
            </a>

        </div>

    </div>
</section>

{% endblock %}
