{% extends "base.html" %}

{% block content %}

<section class="min-h-screen bg-slate-50 px-4 py-16">
    <div class="mx-auto max-w-md">

        <div class="overflow-hidden rounded-3xl bg-white shadow-xl">

            <div class="bg-emerald-800 px-8 py-8 text-center text-white">
                <h1 class="text-3xl font-black">
                    Member Login
                </h1>

                <p class="mt-2 text-sm text-emerald-100">
                    ASOK Foundation Member Portal
                </p>
            </div>

            <div class="p-8">

                {% if error %}
                    <div class="mb-6 rounded-xl bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="post" class="space-y-5">
                    {% csrf_token %}

                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">
                            Member ID
                        </label>

                        <input
                            type="text"
                            name="member_id"
                            placeholder="ASOK-000000001"
                            required
                            autocomplete="username"
                            class="w-full rounded-xl border border-slate-300 px-4 py-3 uppercase outline-none transition focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100"
                        >
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            required
                            autocomplete="current-password"
                            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100"
                        >
                    </div>

                    <button
                        type="submit"
                        class="w-full rounded-xl bg-emerald-700 px-5 py-3 font-black text-white shadow-lg transition hover:bg-emerald-800"
                    >
                        Login to Member Portal
                    </button>
                </form>

                <div class="mt-4 text-center">
    <a
        href="{% url 'membership:password_reset' %}"
        class="text-sm font-semibold text-emerald-700 transition hover:text-emerald-900 hover:underline"
    >
        Forgot Password?
    </a>
</div>

                <div class="mt-6 text-center">
                    <a
                        href="{% url 'membership:member_search' %}"
                        class="text-sm font-bold text-emerald-700 hover:text-emerald-900"
                    >
                        Verify a Member ID
                    </a>
                </div>

            </div>
        </div>

    </div>
</section>

{% endblock %}
