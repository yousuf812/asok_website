{% extends "base.html" %}

{% block content %}

<section class="min-h-screen bg-slate-50 px-4 py-16">
    <div class="mx-auto max-w-md">

        <div class="rounded-3xl bg-white p-8 shadow-xl">

            <div class="mb-8 text-center">
                <h1 class="text-2xl font-black text-emerald-900">
                    Set Your Password
                </h1>

                <p class="mt-2 text-sm text-slate-500">
                    Member ID:
                    <strong>{{ member.member_id }}</strong>
                </p>
            </div>

            {% if error %}
                <div class="mb-6 rounded-xl bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">
                        New Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        minlength="8"
                        required
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100"
                    >
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        minlength="8"
                        required
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full rounded-xl bg-emerald-700 px-5 py-3 font-black text-white transition hover:bg-emerald-800"
                >
                    Set Password & Continue
                </button>

            </form>

        </div>

    </div>
</section>

{% endblock %}
