
{% load static %}

<header
    id="site-header"
    class="sticky top-0 z-50 border-b border-slate-200/80
           bg-white/95 backdrop-blur-md"
>

    <!-- =====================================================
         MAIN HEADER
    ====================================================== -->

    <div class="mx-auto w-full max-w-[1600px] px-3 sm:px-5 lg:px-6 xl:px-8">

        <div class="flex h-24 items-center ">

            <!-- =================================================
                 LOGO
            ================================================== -->

            <a
                href="{% url 'core:home' %}"
               class="group flex w-20 shrink-0 items-center"
                aria-label="ASOK Home"
            >

                <div
                    class="flex h-14 w-14 items-center justify-center
                           overflow-hidden rounded-xl
                           transition duration-300
                           group-hover:scale-105"
                >
                    <img
                        src="{% static 'images/asoklogo.png' %}"
                        alt="ASOK Foundation Logo"
                        class="h-full w-full object-contain"
                    >
                </div>

            </a>

        
            <!-- =================================================
                 DESKTOP NAVIGATION
            ================================================== -->

           
            
<nav
    class="hidden min-w-0 flex-1 items-center justify-start lg:ml-8 lg:flex"
    aria-label="Primary Navigation"
>
    <div class="flex items-center gap-1.5 xl:gap-2">

        <!-- Home -->
        <a
            href="{% url 'core:home' %}"
            class="whitespace-nowrap rounded-lg px-2 py-2 text-[13px] font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-700 xl:px-3 xl:text-sm"
        >
            Home
        </a>

        <!-- About -->
        <a
            href="#about"
            class="whitespace-nowrap rounded-lg px-2 py-2 text-[13px] font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-700 xl:px-3 xl:text-sm"
        >
            About
        </a>

        <!-- Human Rights -->
        <a
            href="{% url 'human_rights:home' %}"
            class="whitespace-nowrap rounded-lg px-2 py-2 text-[13px] font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-700 xl:px-3 xl:text-sm"
        >
            Human Rights
        </a>

        <!-- Legal Aid -->
        <a
            href="{% url 'legal_aid:home' %}"
            class="whitespace-nowrap rounded-lg px-2 py-2 text-[13px] font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-700 xl:px-3 xl:text-sm"
        >
            Legal Aid
        </a>

        <!-- Activities -->
        <a
            href="{% url 'activities:list' %}"
            class="whitespace-nowrap rounded-lg px-2 py-2 text-[13px] font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-700 xl:px-3 xl:text-sm"
        >
            Activities
        </a>

        <!-- Projects -->
        <a
            href="{% url 'projects:list' %}"
            class="whitespace-nowrap rounded-lg px-2 py-2 text-[13px] font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-700 xl:px-3 xl:text-sm"
        >
            Projects
        </a>

        <!-- Blog -->
        <a
            href="{% url 'blog:list' %}"
            class="whitespace-nowrap rounded-lg px-2 py-2 text-[13px] font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-700 xl:px-3 xl:text-sm"
        >
            Blog
        </a>

        <!-- Gallery -->
        <a
            href="{% url 'gallery:list' %}"
            class="whitespace-nowrap rounded-lg px-2 py-2 text-[13px] font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-700 xl:px-3 xl:text-sm"
        >
            Gallery
        </a>

        <!-- Our Team -->
        <a
            href="{% url 'team:list' %}"
            class="whitespace-nowrap rounded-lg px-2 py-2 text-[13px] font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-700 xl:px-3 xl:text-sm"
        >
            Our Team
        </a>

        <!-- Contact -->
        <a
            href="{% url 'contacts:home' %}"
            class="whitespace-nowrap rounded-lg px-2 py-2 text-[13px] font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-700 xl:px-3 xl:text-sm"
        >
            Contact
        </a>

    </div>
</nav>


            <!-- =================================================
                 DESKTOP RIGHT SIDE
            ================================================== -->

            <div
                class="hidden shrink-0 items-center gap-2 xl:gap-3 lg:flex"
            >

                <!-- Member ID Search -->
                <form
                    method="get"
                    action="{% url 'membership:member_search' %}"
                    class="flex shrink-0 items-center"
                >

                    <div
                        class="flex overflow-hidden rounded-xl
                               border border-slate-200 bg-white
                               shadow-sm transition
                               focus-within:border-emerald-500
                               focus-within:ring-4
                               focus-within:ring-emerald-100"
                    >

                        <input
                            type="text"
                            name="member_id"
                            placeholder="Member ID"
                            autocomplete="off"
                            aria-label="Enter Member ID"
                            class="w-24 border-0 bg-transparent
                                   px-2.5 py-2 text-xs font-semibold
                                   text-slate-800 outline-none
                                   placeholder:text-slate-400
                                   xl:w-28"
                        >

                        <button
                            type="submit"
                            aria-label="Verify Member ID"
                            title="Verify Member ID"
                            class="flex w-8 items-center justify-center
                                   bg-emerald-950 text-white transition
                                   hover:bg-emerald-800"
                        >

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="2"
                                stroke="currentColor"
                                class="h-4 w-4"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"
                                />
                            </svg>

                        </button>

                    </div>

                </form>


                <!-- Get Help -->
                <a
                    href="{% url 'legal_aid:home' %}"
                    class="whitespace-nowrap rounded-xl
                           border border-emerald-600
                           px-3 py-2 text-xs font-semibold
                           text-emerald-700 transition
                           hover:bg-emerald-50
                           xl:px-4 xl:text-sm"
                >
                    Get Help
                </a>


                <!-- Report Concern -->
                <a
                    href="{% url 'complaints:home' %}"
                    class="whitespace-nowrap rounded-xl
                           border border-emerald-600
                           px-3 py-2 text-xs font-semibold
                           text-emerald-700 transition
                           hover:bg-emerald-50
                           xl:px-4 xl:text-sm"
                >
                    Report Concern
                </a>


                <!-- Donate -->
                <a
                    href="{% url 'donations:home' %}"
                    class="whitespace-nowrap rounded-xl
                           bg-emerald-600
                           px-4 py-2 text-xs font-semibold
                           text-white shadow-lg
                           shadow-emerald-600/20
                           transition duration-300
                           hover:-translate-y-0.5
                           hover:bg-emerald-700
                           hover:shadow-xl
                           xl:px-5 xl:text-sm"
                >
                    Donate
                </a>

            </div>


            <!-- =================================================
                 MOBILE MENU BUTTON
            ================================================== -->

            <button
                id="mobile-menu-button"
                type="button"
                class="ml-auto inline-flex h-11 w-11 shrink-0
                       items-center justify-center rounded-xl
                       border border-slate-200
                       text-slate-700 transition
                       hover:border-emerald-500
                       hover:text-emerald-600
                       lg:hidden"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="mobile-menu"
            >

                <!-- Open Icon -->
                <svg
                    id="menu-open-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="h-6 w-6"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 6h16M4 12h16M4 18h16"
                    />
                </svg>


                <!-- Close Icon -->
                <svg
                    id="menu-close-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="hidden h-6 w-6"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M6 18 18 6M6 6l12 12"
                    />
                </svg>

            </button>

        </div>


        <!-- =====================================================
             MOBILE NAVIGATION
        ====================================================== -->

        <div
            id="mobile-menu"
            class="hidden border-t border-slate-100 py-5 lg:hidden"
        >

            <!-- Mobile Member Verification -->
            <div class="mb-4">

                <form
                    method="get"
                    action="{% url 'membership:member_search' %}"
                >

                    <label
                        for="mobile-member-id"
                        class="mb-2 block px-1 text-xs font-bold
                               uppercase tracking-wider text-slate-500"
                    >
                        Verify Member ID
                    </label>

                    <div
                        class="flex overflow-hidden rounded-xl
                               border border-slate-200 bg-white
                               shadow-sm
                               focus-within:border-emerald-500
                               focus-within:ring-4
                               focus-within:ring-emerald-100"
                    >

                        <input
                            id="mobile-member-id"
                            type="text"
                            name="member_id"
                            placeholder="ASOK-000000001"
                            autocomplete="off"
                            class="min-w-0 flex-1 border-0
                                   bg-transparent px-4 py-3
                                   text-sm font-semibold
                                   text-slate-800 outline-none
                                   placeholder:text-slate-400"
                        >

                        <button
                            type="submit"
                            class="flex items-center justify-center
                                   bg-emerald-950 px-5
                                   text-sm font-bold text-white
                                   transition hover:bg-emerald-800"
                        >

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="2"
                                stroke="currentColor"
                                class="mr-2 h-4 w-4"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"
                                />
                            </svg>

                            Verify

                        </button>

                    </div>

                </form>

            </div>


            <!-- Mobile Links -->
            <nav
                class="flex flex-col gap-1"
                aria-label="Mobile Navigation"
            >

                <a
                    href="{% url 'core:home' %}"
                    class="mobile-nav-link rounded-lg px-4 py-3
                           text-sm font-medium text-slate-700
                           transition hover:bg-emerald-50
                           hover:text-emerald-700"
                >
                    Home
                </a>

                <a
                    href="#about"
                    class="mobile-nav-link rounded-lg px-4 py-3
                           text-sm font-medium text-slate-700
                           transition hover:bg-emerald-50
                           hover:text-emerald-700"
                >
                    About
                </a>

                <a
                    href="{% url 'human_rights:home' %}"
                    class="mobile-nav-link rounded-lg px-4 py-3
                           text-sm font-medium text-slate-700
                           transition hover:bg-emerald-50
                           hover:text-emerald-700"
                >
                    Human Rights
                </a>

                <a
                    href="{% url 'legal_aid:home' %}"
                    class="mobile-nav-link rounded-lg px-4 py-3
                           text-sm font-medium text-slate-700
                           transition hover:bg-emerald-50
                           hover:text-emerald-700"
                >
                    Legal Aid
                </a>

                <a
                    href="{% url 'activities:list' %}"
                    class="mobile-nav-link rounded-lg px-4 py-3
                           text-sm font-medium text-slate-700
                           transition hover:bg-emerald-50
                           hover:text-emerald-700"
                >
                    Activities
                </a>

                <a
                    href="{% url 'projects:list' %}"
                    class="mobile-nav-link rounded-lg px-4 py-3
                           text-sm font-medium text-slate-700
                           transition hover:bg-emerald-50
                           hover:text-emerald-700"
                >
                    Projects
                </a>

                <a
                    href="{% url 'blog:list' %}"
                    class="mobile-nav-link rounded-lg px-4 py-3
                           text-sm font-medium text-slate-700
                           transition hover:bg-emerald-50
                           hover:text-emerald-700"
                >
                    Blog
                </a>

                <a
                    href="{% url 'gallery:list' %}"
                    class="mobile-nav-link rounded-lg px-4 py-3
                           text-sm font-medium text-slate-700
                           transition hover:bg-emerald-50
                           hover:text-emerald-700"
                >
                    Gallery
                </a>

                <a
                    href="{% url 'team:list' %}"
                    class="mobile-nav-link rounded-lg px-4 py-3
                           text-sm font-medium text-slate-700
                           transition hover:bg-emerald-50
                           hover:text-emerald-700"
                >
                    Our Team
                </a>

                <a
                    href="{% url 'contacts:home' %}"
                    class="mobile-nav-link rounded-lg px-4 py-3
                           text-sm font-medium text-slate-700
                           transition hover:bg-emerald-50
                           hover:text-emerald-700"
                >
                    Contact
                </a>

            </nav>


            <!-- Mobile CTA -->
            <div class="mt-4 grid grid-cols-2 gap-3">

                <a
                    href="{% url 'legal_aid:home' %}"
                    class="mobile-nav-link rounded-xl border
                           border-emerald-600 px-4 py-3
                           text-center text-sm font-semibold
                           text-emerald-700 transition
                           hover:bg-emerald-50"
                >
                    Get Help
                </a>

                <a
                    href="{% url 'complaints:home' %}"
                    class="mobile-nav-link rounded-xl border
                           border-emerald-600 px-4 py-3
                           text-center text-sm font-semibold
                           text-emerald-700 transition
                           hover:bg-emerald-50"
                >
                    Report Concern
                </a>

                <a
                    href="{% url 'donations:home' %}"
                    class="col-span-2 rounded-xl
                           bg-emerald-600 px-4 py-3
                           text-center text-sm font-semibold
                           text-white transition
                           hover:bg-emerald-700"
                >
                    Donate
                </a>

            </div>

        </div>

    </div>

</header>
